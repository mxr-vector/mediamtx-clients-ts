<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">MediaMTX WebRTC RTSP Monitor Client Architecture</title>
  <desc id="desc">RTSP sources send or expose streams to MediaMTX. The Vue browser client posts a WHEP SDP offer, receives an SDP answer, then plays WebRTC RTP and RTCP media in video tiles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#061b18"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="server" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#173b6c"/>
      <stop offset="1" stop-color="#102640"/>
    </linearGradient>
    <linearGradient id="browser" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102033"/>
      <stop offset="1" stop-color="#101820"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10 Z" fill="#58a6ff"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10 Z" fill="#3fb950"/>
    </marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10 Z" fill="#d29922"/>
    </marker>
    <style>
      .label { fill: #e6edf3; font: 700 22px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #8b949e; font: 15px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { fill: #c9d1d9; font: 14px "SFMono-Regular", Consolas, monospace; }
      .small { fill: #8b949e; font: 12px "SFMono-Regular", Consolas, monospace; }
      .chip { fill: #0d1117; stroke: #30363d; stroke-width: 1.2; }
      .outline { fill: url(#panel); stroke: #30363d; stroke-width: 1.5; }
      .accent-blue { stroke: #58a6ff; }
      .accent-green { stroke: #3fb950; }
      .accent-amber { stroke: #d29922; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="188" cy="132" r="210" fill="#58a6ff" opacity="0.06"/>
  <circle cx="1056" cy="592" r="260" fill="#3fb950" opacity="0.05"/>

  <text x="56" y="64" class="label" font-size="28">MediaMTX WebRTC RTSP Monitor Client</text>
  <text x="56" y="92" class="muted">Vue 3 + Vite browser receiver using MediaMTX WHEP, without a custom WebSocket signaling server</text>

  <!-- RTSP sources -->
  <g filter="url(#shadow)">
    <rect x="58" y="166" width="274" height="382" rx="22" class="outline"/>
    <text x="88" y="210" class="label">RTSP Sources</text>
    <text x="88" y="236" class="muted">cameras / encoders / files</text>

    <g transform="translate(88 278)">
      <rect width="92" height="58" rx="10" fill="#0d1117" stroke="#30363d"/>
      <circle cx="30" cy="29" r="16" fill="#17283c" stroke="#58a6ff" stroke-width="2"/>
      <circle cx="30" cy="29" r="7" fill="#58a6ff" opacity="0.8"/>
      <path d="M58 19 h20 l10 10 -10 10 H58 Z" fill="#21262d" stroke="#30363d"/>
      <text x="0" y="86" class="mono">camera1</text>
    </g>

    <g transform="translate(88 398)">
      <rect width="92" height="58" rx="10" fill="#0d1117" stroke="#30363d"/>
      <circle cx="30" cy="29" r="16" fill="#17283c" stroke="#58a6ff" stroke-width="2"/>
      <circle cx="30" cy="29" r="7" fill="#58a6ff" opacity="0.8"/>
      <path d="M58 19 h20 l10 10 -10 10 H58 Z" fill="#21262d" stroke="#30363d"/>
      <text x="0" y="86" class="mono">camera2</text>
    </g>

    <rect x="88" y="492" width="186" height="34" rx="17" class="chip"/>
    <text x="108" y="514" class="small">rtsp://.../{path}</text>
  </g>

  <!-- MediaMTX server -->
  <g filter="url(#shadow)">
    <rect x="494" y="178" width="292" height="358" rx="24" fill="url(#server)" stroke="#58a6ff" stroke-opacity="0.42" stroke-width="1.5"/>
    <text x="538" y="222" class="label">MediaMTX Server</text>
    <text x="538" y="250" class="muted">RTSP ingest + WebRTC egress</text>

    <g transform="translate(538 290)">
      <rect width="204" height="48" rx="10" fill="#0d1117" stroke="#30363d"/>
      <text x="20" y="30" class="mono">path: camera1</text>
      <rect y="66" width="204" height="48" rx="10" fill="#0d1117" stroke="#30363d"/>
      <text x="20" y="96" class="mono">path: camera2</text>
      <rect y="150" width="204" height="52" rx="10" fill="#0d1117" stroke="#30363d"/>
      <text x="20" y="181" class="mono">/{path}/whep</text>
    </g>
  </g>

  <!-- Browser client -->
  <g filter="url(#shadow)">
    <rect x="946" y="148" width="282" height="428" rx="24" fill="url(#browser)" stroke="#30363d" stroke-width="1.5"/>
    <rect x="946" y="148" width="282" height="52" rx="24" fill="#161b22"/>
    <circle cx="980" cy="174" r="6" fill="#f85149"/>
    <circle cx="1002" cy="174" r="6" fill="#d29922"/>
    <circle cx="1024" cy="174" r="6" fill="#3fb950"/>
    <text x="1050" y="181" class="mono">Vue Dashboard</text>

    <text x="982" y="238" class="label">Browser</text>
    <text x="982" y="264" class="muted">RTCPeerConnection</text>

    <g transform="translate(982 298)">
      <rect width="96" height="70" rx="10" fill="#010409" stroke="#30363d"/>
      <rect x="10" y="10" width="76" height="36" rx="6" fill="#0b2a3d"/>
      <rect x="12" y="52" width="54" height="8" rx="4" fill="#3fb950" opacity="0.9"/>
      <text x="0" y="94" class="small">CAM-01 connected</text>
    </g>
    <g transform="translate(1094 298)">
      <rect width="96" height="70" rx="10" fill="#010409" stroke="#30363d"/>
      <rect x="10" y="10" width="76" height="36" rx="6" fill="#132a20"/>
      <rect x="12" y="52" width="54" height="8" rx="4" fill="#d29922" opacity="0.9"/>
      <text x="0" y="94" class="small">CAM-02 signaling</text>
    </g>

    <rect x="982" y="442" width="208" height="42" rx="12" class="chip"/>
    <text x="1002" y="468" class="mono">MediaStream → video</text>
    <rect x="982" y="500" width="208" height="38" rx="19" fill="#12351f" stroke="#2ea043" stroke-width="1"/>
    <text x="1019" y="524" class="mono" fill="#3fb950">↺ manual reconnect</text>
  </g>

  <!-- Flow arrows -->
  <path d="M334 330 C386 330 428 318 484 316" fill="none" stroke="#58a6ff" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <rect x="360" y="280" width="98" height="32" rx="16" fill="#0d1117" stroke="#58a6ff" stroke-opacity="0.45"/>
  <text x="380" y="301" class="mono">RTSP</text>

  <path d="M946 292 C878 274 846 262 794 262" fill="none" stroke="#d29922" stroke-width="4" marker-end="url(#arrowAmber)"/>
  <rect x="802" y="212" width="132" height="38" rx="19" fill="#0d1117" stroke="#d29922" stroke-opacity="0.45"/>
  <text x="820" y="236" class="small">POST SDP offer</text>

  <path d="M794 328 C852 334 884 344 936 356" fill="none" stroke="#d29922" stroke-width="4" marker-end="url(#arrowAmber)"/>
  <rect x="810" y="358" width="116" height="36" rx="18" fill="#0d1117" stroke="#d29922" stroke-opacity="0.45"/>
  <text x="829" y="381" class="small">SDP answer</text>

  <path d="M790 446 C850 470 880 486 936 493" fill="none" stroke="#3fb950" stroke-width="5" stroke-dasharray="9 8" marker-end="url(#arrowGreen)"/>
  <rect x="796" y="488" width="138" height="38" rx="19" fill="#0d1117" stroke="#3fb950" stroke-opacity="0.45"/>
  <text x="813" y="512" class="small">WebRTC media</text>

  <!-- Footer notes -->
  <g transform="translate(56 620)">
    <rect width="1168" height="52" rx="16" fill="#0d1117" stroke="#30363d"/>
    <text x="24" y="32" class="mono">Configurable via VITE_MEDIAMTX_HOST, VITE_MEDIAMTX_WEBRTC_PORT, VITE_MEDIAMTX_STREAM_PATHS, VITE_MEDIAMTX_WHEP_PATH_TEMPLATE, and VITE_WEBRTC_STUN_URLS</text>
  </g>
</svg>
